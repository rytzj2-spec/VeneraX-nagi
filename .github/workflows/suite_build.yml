# Nagisaland 手机版（suite 分支）：Nagisaland 主界面 + 漫画 VeneraX + 番剧 Kazumi + H（Han1meViewer）
# 一个工程编出完整的 com.nagisaland.mobile，Android arm64-v8a。
# - 推到 suite / unify-* 自动编译；也可以在 Actions 里手动运行（可选任意分支）。
# - APK 在该次运行的 Artifacts（Nagisaland-suite-arm64），suite 分支的构建还会推到 apk-suite 分支。
# - 用一次性的临时密钥签名；正式签名（nagisaland-mobile.keystore）和内置模拟器 APK 在用户电脑上用
#   Nagisaland-Mobile 仓库的 sign_release.py 加，密钥不进仓库。
# - 番剧的弹幕 / Bangumi 镜像密钥：在仓库 Settings → Secrets and variables → Actions 里加
#   DANDANAPI_APPID、DANDANAPI_KEY（弹弹play 开放平台）、KAZUMI_APPID、KAZUMI_KEY（可选），
#   有就以 --dart-define 传入，没有就不传（Bangumi 自动走官方接口，弹幕不可用）。
name: Nagisaland suite build
run-name: Nagisaland suite build (${{ github.ref_name }} ${{ github.sha }})
on:
  workflow_dispatch:
  push:
    branches: [suite, "unify-*"]
    paths-ignore:
      - "**.md"
      - "doc/**"
      - "release-notes/**"

concurrency:
  group: nagi-suite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android_arm64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: rm -rf /opt/hostedtoolcache
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'
          cache: gradle
      - name: Resolve dependencies
        run: flutter pub get
      - name: Throwaway signing key
        run: |
          keytool -genkeypair -keystore android/keystore.jks -alias nagi -keyalg RSA -keysize 2048 \
            -validity 3650 -storepass nagioffline -keypass nagioffline -dname "CN=Nagisaland offline"
          printf 'storeFile=keystore.jks\nstorePassword=nagioffline\nkeyAlias=nagi\nkeyPassword=nagioffline\n' > android/key.properties
      - name: Check rust-toolchain.toml
        run: rustup show
      - name: Build
        env:
          DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
          DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
          KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
          KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}
        run: |
          defines=()
          for name in DANDANAPI_APPID DANDANAPI_KEY KAZUMI_APPID KAZUMI_KEY; do
            if [ -n "${!name}" ]; then
              defines+=("--dart-define=${name}=${!name}")
              echo "dart-define: ${name} (from secrets)"
            fi
          done
          flutter build apk --release --target-platform android-arm64 "${defines[@]}"
      - name: Rename
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml); version="${version%%+*}"
          kz=$(sed -n 's/^version:[[:space:]]*//p' packages/kazumi/pubspec.yaml); kz="${kz%%+*}"
          mkdir -p out
          nagi=$(sed -n 's/^versionName=//p' android/nagisaland.properties)
          cp build/app/outputs/apk/release/*arm64-v8a*.apk "out/Nagisaland-v${nagi}-vx${version}-kz${kz}-arm64-v8a.apk"
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: Nagisaland-suite-arm64
          path: out/*.apk
      - name: Push APK to apk-suite branch
        if: github.ref == 'refs/heads/suite'
        run: |
          set -euo pipefail
          cd out
          name=$(ls *.apk | head -1)
          printf '{"file":"%s","size":%s,"commit":"%s","run_id":%s,"date":"%s"}\n' "$name" "$(stat -c %s "$name")" \
            "${{ github.sha }}" "${{ github.run_id }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > nagi-info.json
          git init -q -b apk-suite
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "suite APK from run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-suite
