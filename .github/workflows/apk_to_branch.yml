# （备用，手动运行）把某次编译的 APK（Artifacts）提交到 apk 分支，方便用 git 拉取（Artifacts 的下载地址在部分网络环境下打不开）。
name: Copy APK to apk branch
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Nagisaland offline build 的运行 ID"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  copy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: VeneraX-nagi-arm64
          path: apk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - name: Commit to apk branch
        run: |
          set -euo pipefail
          ls -la apk
          cd apk
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "APK from run ${{ inputs.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
