plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 3]

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// Nagisaland 的版本号（android/nagisaland.properties）
def nagiProperties = new Properties()
rootProject.file("nagisaland.properties").withReader("UTF-8") { nagiProperties.load(it) }

// 本地专用设置（不进 Git，仓库是公开的）：android/nagi_local.properties，例如 shareServer=https://你的域名/share/
def nagiLocal = new Properties()
def nagiLocalFile = rootProject.file("nagi_local.properties")
if (nagiLocalFile.exists()) nagiLocalFile.withReader("UTF-8") { nagiLocal.load(it) }

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
// Explicit unsigned cloud build; default local release signing is unchanged.
def nagiUnsignedBuild = providers.gradleProperty("nagiUnsignedBuild").orNull == "true"
def releaseStoreFile = null
if (!nagiUnsignedBuild) {
    if (!keystorePropertiesFile.exists()) {
        throw new GradleException("Missing android/key.properties for release signing")
    }
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    ["storeFile", "storePassword", "keyAlias", "keyPassword"].each { key ->
        def value = keystoreProperties[key]
        if (value == null || value.toString().trim().isEmpty()) {
            throw new GradleException("Missing android/key.properties value: ${key}")
        }
    }
    releaseStoreFile = rootProject.file(keystoreProperties["storeFile"])
    if (!releaseStoreFile.exists()) {
        throw new GradleException("Missing Android release keystore file: ${releaseStoreFile}")
    }
}

android {
    namespace = "io.github.kyosee.venera"
    compileSdk = flutter.compileSdkVersion
    ndkVersion "28.0.13004108"

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    splits{
        abi {
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            enable true
            universalApk true
        }
    }

    // H 分区（Han1meViewer）用了 DataBinding：作为库使用时 app 模块也必须打开，
    // 否则不会生成汇总的 androidx.databinding.DataBinderMapperImpl，一打开 H 的界面就崩
    buildFeatures {
        dataBinding true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true   // H 分区（Han1meViewer）需要
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions{
        jvmTarget = JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            if (!nagiUnsignedBuild) {
                storeFile releaseStoreFile
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
        release {
            if (!nagiUnsignedBuild) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile releaseStoreFile
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        // 屏幕共享的默认服务器（App 里没填时用它）
        resValue "string", "nagi_share_server", nagiLocal.getProperty("shareServer", "")
        // Nagisaland 统一应用：包名 com.nagisaland.mobile（覆盖安装原来的 Nagisaland，数据保留）。
        // 代码的命名空间仍是 io.github.kyosee.venera，provider 的 authority 都用 ${applicationId} 自动跟着包名走。
        applicationId = "com.nagisaland.mobile"
        minSdk = Math.max(flutter.minSdkVersion, 24)
        // 保持 34（以前合并版 APK 用的就是 Nagisaland 的 34，真机验证过）。35+ 会强制全屏绘制，打乱各分区底栏和沉浸模式
        targetSdk = 34
        versionCode = nagiProperties["versionCode"].toInteger()
        versionName = nagiProperties["versionName"]
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // flutter_onnxruntime: keep the ONNX Runtime Java API from R8
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
            signingConfig = nagiUnsignedBuild ? null : signingConfigs.release
        }
        debug {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
            signingConfig = nagiUnsignedBuild ? null : signingConfigs.debug
        }
    }

    // 只自己用：各架构的包用同一个 versionCode（不再按架构 ×10 加后缀）
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            outputFileName = "Nagisaland-${variant.versionName}" + (abi != null ? "-${abi}" : "") + ".apk"
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

flutter {
    source = "../.."
}

// H 分区的老依赖带进来的 kotlin-android-extensions-runtime 和 kotlin-parcelize-runtime 类重复，去掉老的
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-android-extensions-runtime'
}

dependencies {
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // 提供 NotificationCompat 与 ContextCompat.startForegroundService，供后台下载前台服务使用。
    implementation 'androidx.core:core-ktx:1.13.1'
    // Nagisaland suite：H 分区（Han1meViewer）
    implementation project(':han')
    // Nagisaland：进程启动初始化（SuiteStartup）、底栏编辑列表（拖动排序）
    implementation 'androidx.startup:startup-runtime:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Nagisaland：屏幕共享「经服务器」（WebRTC：硬件 H.264、直连优先，TURN 兜底；牵线用 OkHttp WebSocket，版本和 H 模块一样）
    implementation 'io.getstream:stream-webrtc-android:1.3.10'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // 陪伴地图：原生地图，不依赖 Google Play 服务；仅在独立功能分支启用。
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
